name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and pack
        run: |
          npm run build
          npm pack
          cp discord-cli-*.tgz discord-cli.tgz

      - name: Verify package contents
        run: |
          tar -tzf discord-cli.tgz | grep -q '^package/dist/' || { echo "dist/ missing from package"; exit 1; }

      - name: Create checksums
        run: sha256sum discord-cli-*.tgz discord-cli.tgz > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            discord-cli-*.tgz
            discord-cli.tgz
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true